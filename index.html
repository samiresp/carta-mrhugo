<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Instrucciones para que el navegador no guarde esta página en su memoria -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Cargando carta de Mr. Hugo...</title>
  </head>
  <body style="font-family: sans-serif; text-align: center; margin-top: 20%;">
    <p>Redirigiendo al menú actualizado...</p>
    
    <script>
      // 1. Aquí va tu enlace de Dropbox (el que termina en raw=1)
      var enlaceBase = "https://www.dropbox.com/scl/fi/jt14kaezd8fpoybwvu58l/CartaMrHugoV2.pdf?rlkey=pwp93usv0vwfeilg9wz0tem2w&st=zzhbcv75&raw=1";
      
      // 2. Creamos un número único usando la hora exacta
      var engañoParaMemoria = "&tiempo=" + new Date().getTime();
      
      // 3. Juntamos el enlace con el número para forzar la descarga
      window.location.replace(enlaceBase + engañoParaMemoria);
    </script>
  </body>
</html>
